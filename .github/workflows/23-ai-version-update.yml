name: "23 AI - Version Update"
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check dependency versions
        id: check
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements.txt --format json --output /tmp/pip-audit.json 2>/dev/null || true
          pip-audit --project-path . --format json --output /tmp/pip-audit2.json 2>/dev/null || true
          echo "done=1" >> $GITHUB_OUTPUT

      - name: AI Version Report
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_GENERIC_MODEL: ${{ vars.NVIDIA_GENERIC_MODEL || 'deepseek-ai/deepseek-v4-flash-0731' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/pip-audit.json ]; then
            python -m ai_workflow audit \
              --report /tmp/pip-audit.json || true
          fi
          if [ -f /tmp/pip-audit2.json ]; then
            python -m ai_workflow audit \
              --report /tmp/pip-audit2.json || true
          fi

      - name: Create version update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Monthly Dependency Version Check - $(date +%Y-%m)" \
            --label "dependency-check" \
            --body "## Monthly Dependency Check\n\nScan completed on $(date +%Y-%m-%d).\n\nCheck pip-audit results above for any outdated dependencies." || true
