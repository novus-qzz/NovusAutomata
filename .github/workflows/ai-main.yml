name: AI 自动化入口

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 2 * * *'   # 每日 02:00 运行一次
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all AI steps (true/false)'
        required: false
        default: 'false'

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Run CI tests
        run: |
          pytest
      - name: Security Scan
        run: |
          python -m ai_workflow.commands.audit

  ai_tasks:
    needs: precheck
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.precheck.result == 'success' || inputs.run_all == 'true') }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          python -m pip install toml
      - name: Load AI config
        id: cfg
        run: |
          python - <<'PY'
          import toml, json, os
          cfg = toml.load('pyproject.toml')
          ai = cfg.get('tool', {}).get('ai', {})
          print('::set-output name=enabled::' + str(ai.get('enabled', True)).lower())
          PY
      - name: AI Welcome Contributor
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.welcome
      - name: AI Assign Reviewer
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.assign
      - name: AI PR Review
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.review
      - name: AI PR Description
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.describe
      - name: AI Auto Fix
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.fix
      - name: AI Test Generator
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.gentest
      - name: AI Code Health Report
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.health
      - name: AI Security Audit
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.audit
      - name: AI Dependency Version Check
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.version
      - name: AI Weekly Summary
        if: steps.cfg.outputs.enabled == 'true'
        run: python -m ai_workflow.commands.summary

  artifacts:
    needs: ai_tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: ai-reports
          path: reports/*.md