name: "10 AI - Code Simplify"
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze code simplifications
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python .github/scripts/nvidia_ai.py simplify > simplify_report.md

      - name: Create PR with suggestions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s simplify_report.md ] && [ "$(head -1 simplify_report.md)" != "" ]; then
            BRANCH="ai/simplify-$(date +%Y%m%d)"
            git checkout -b "$BRANCH" || true
            git add -A
            git commit -m "chore: code simplification suggestions [skip ci]" || true
            git push origin "$BRANCH" || true
            gh pr create \
              --title "chore: weekly code simplification suggestions" \
              --body "$(cat simplify_report.md)" \
              --head "$BRANCH" \
              --label "ai-generated" || true
          fi