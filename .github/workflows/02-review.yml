name: "02 Review - reviewdog"
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - uses: ./.github/actions/detect-language
        id: detect

      - if: steps.detect.outputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.detect.outputs.language == 'node'
        run: npm ci || npm install
      - if: steps.detect.outputs.language == 'node'
        run: npx --yes eslint -f checkstyle . | reviewdog -f=checkstyle -name=eslint -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.detect.outputs.language == 'python'
        run: pip install ruff
      - if: steps.detect.outputs.language == 'python'
        run: ruff check --output-format rdjson . | reviewdog -f=rdjson -name=ruff -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.detect.outputs.language == 'go'
        uses: golangci/golangci-lint-action@v6
      - if: steps.detect.outputs.language == 'go'
        run: golangci-lint run --out-format=checkstyle . | reviewdog -f=checkstyle -name=golangci-lint -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}