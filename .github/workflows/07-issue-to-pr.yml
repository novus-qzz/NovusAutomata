name: "07 AI - Issue to PR"
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  convert:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.label.name, 'ai-ready') ||
      contains(github.event.label.name, 'auto-fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get issue details
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=${{ github.event.inputs.issue-number || github.event.issue.number }}
          echo "number=$NUM" >> $GITHUB_OUTPUT
          echo "title=$(gh issue view $NUM --json title --jq .title)" >> $GITHUB_OUTPUT
          echo "body=$(gh issue view $NUM --json body --jq .body)" >> $GITHUB_OUTPUT

      - name: Generate fix from issue
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python .github/scripts/nvidia_ai.py fix --pr-number ""

      - name: Create PR
        if: steps.issue.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="fix/issue-${{ steps.issue.outputs.number }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-fix for issue #${{ steps.issue.outputs.number }}" || true
          git push origin "$BRANCH" || true
          gh pr create \
            --title "Fix: ${{ steps.issue.outputs.title }}" \
            --body "Auto-generated PR to address issue #${{ steps.issue.outputs.number }}.\n\nCloses #${{ steps.issue.outputs.number }}" \
            --head "$BRANCH" || true