name: "17 AI - Test Generator"
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  gentest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python .github/scripts/nvidia_ai.py gentest \
            --pr-number ${{ github.event.inputs.pr-number || github.event.pull_request.number || '' }}

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain tests/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push tests
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "novus-automata[bot]"
          git config user.email "bot@novusautomata.dev"
          git add tests/
          git commit -m "test: auto-generate tests [NovusAutomata]"
          git push