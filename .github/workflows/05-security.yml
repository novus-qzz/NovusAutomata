name: "05 Security - Static Scan"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret leak scan (gitleaks)
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source . --no-banner

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python security scan (bandit)
        run: |
          pip install bandit
          bandit -r . -x .github -ll

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit
