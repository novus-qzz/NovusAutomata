name: "05 Security - CodeQL"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python,go,java-kotlin,ruby,cpp,csharp
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3