name: "08 AI - Issue Response"
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  respond:
    if: contains(github.event.comment.body, '@ai') || contains(github.event.comment.body, '@assistant')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Respond to issue comment
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/nvidia_ai.py respond \
            --issue-number ${{ github.event.issue.number }} \
            --comment "${{ github.event.comment.body }}"