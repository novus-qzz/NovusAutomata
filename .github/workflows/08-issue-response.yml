name: "08 AI - Issue Response"
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number"
        required: true
      comment:
        description: "Comment to respond to"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  respond:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.comment.user.type == 'user'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: AI Issue Response
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_GENERIC_MODEL: ${{ vars.NVIDIA_GENERIC_MODEL || 'deepseek-ai/deepseek-v4-flash' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ai_workflow respond \
            --issue-number ${{ github.event.inputs.issue-number || github.event.issue.number }} \
            --comment "${{ github.event.inputs.comment || github.event.comment.body }}"
