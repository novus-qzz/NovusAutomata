name: "20 AI - Code Health Report"
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month label"
        required: false
        default: ""

permissions:
  issues: write
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate health report
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/nvidia_ai.py health \
            --month "${{ github.event.inputs.month || '$(date +%Y-%m)' }}"