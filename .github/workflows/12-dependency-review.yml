name: "12 AI - Dependency Review"
on:
  pull_request:
    paths:
      - "requirements.txt"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "Pipfile"
      - "go.mod"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: AI Dependency Review
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_SECURITY_MODEL: ${{ vars.NVIDIA_SECURITY_MODEL || 'minimaxai/minimax-m3' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ai_workflow deps | tee /tmp/deps-review.txt

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/deps-review.txt ]; then
            BODY="## AI Dependency Review\n\n\`\`\`\n$(cat /tmp/deps-review.txt)\n\`\`\`"
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY" || true
          fi
