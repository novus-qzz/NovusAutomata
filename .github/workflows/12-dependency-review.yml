name: "12 AI - Dependency Review"
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements/*.txt"
      - "Pipfile*"
      - "poetry.lock"
      - "setup.py"
      - "setup.cfg"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AI dependency analysis
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python .github/scripts/nvidia_ai.py deps \
            --pr-number ${{ github.event.pull_request.number }}