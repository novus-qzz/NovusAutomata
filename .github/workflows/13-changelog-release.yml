name: "13 AI - Changelog & Release"
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      from-tag:
        description: "Start tag"
        required: false
      to-tag:
        description: "End tag"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: AI Changelog
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_CHANGELOG_MODEL: ${{ vars.NVIDIA_CHANGELOG_MODEL || 'deepseek-ai/deepseek-v4-flash' }}
        run: |
          python -m ai_workflow changelog \
            --from-tag "${{ github.event.inputs.from-tag || github.event.release.tag_name || '' }}" \
            --to-tag "${{ github.event.inputs.to-tag || 'HEAD' }}"

      - name: Commit changelog
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "novus-automata[bot]"
            git config user.email "bot@novusautomata.dev"
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG [NovusAutomata]"
            git push origin HEAD:$(git branch --show-current) || true
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Release ${GITHUB_REF#refs/tags/}" \
            --notes "$(sed -n '/^## /,$p' CHANGELOG.md | head -n 60)"
