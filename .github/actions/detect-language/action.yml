name: Detect Language
description: Auto-detect the primary programming language of the repository

outputs:
  language:
    description: Detected language (node|python|go|rust|java|static|docker|generic)
    value: ${{ steps.detect.outputs.language }}

runs:
  using: composite
  steps:
    - name: Detect language
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        LANG="generic"

        if [ -f package.json ] || [ -f pnpm-lock.yaml ] || [ -f yarn.lock ] || [ -f package-lock.json ]; then
          LANG="node"
        elif [ -f go.mod ] || [ -f go.sum ]; then
          LANG="go"
        elif [ -f Cargo.toml ] || [ -f Cargo.lock ]; then
          LANG="rust"
        elif [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] || [ -f Pipfile ]; then
          LANG="python"
        elif [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f settings.gradle ]; then
          LANG="java"
        elif [ -f index.html ] || [ -f vite.config.js ] || [ -f vite.config.ts ] || [ -f next.config.js ] || [ -f astro.config.mjs ]; then
          LANG="static"
        elif [ -f Dockerfile ] || [ -f docker-compose.yml ] || [ -f compose.yml ]; then
          LANG="docker"
        fi

        echo "language=$LANG" >> "$GITHUB_OUTPUT"
        echo "::notice::Detected language: $LANG"